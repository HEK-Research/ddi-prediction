name: ddi-prediction
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version  
  - python=3.11

  # File handling
  - pyarrow=23.0.1

  # Core scientific computing 
  - numpy=1.26.4
  - pandas>=2.2.0
  - scipy>=1.14.0

  # Machine learning 
  - scikit-learn>=1.5.0

  # Statistics
  - statsmodels=0.14.6

  # Network Analysis
  - networkx=3.1

  # Chemistry & Bioinformatics
  - rdkit>=2024.09.5
  - biopython>=1.84

  # Visualization
  - matplotlib=3.8.0
  - matplotlib-venn=1.1.2
  - seaborn=0.12.2

  # Jupyter Ecosystem (removed to avoid platform-specific resolution errors).
  # Install Jupyter components after creating the environment, e.g.:
  #   conda activate ddi-prediction
  #   conda install -c conda-forge jupyterlab ipywidgets ipykernel

  # Data Import/Export
  - openpyxl=3.1.5

  # Utilities
  - requests=2.32.5
  - pyyaml=6.0.3

  # Pip packages
  - pip
  - pip:
      - gensim==4.4.0
      - node2vec==0.5.0
