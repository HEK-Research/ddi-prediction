name: ddi-prediction
channels:
  - conda-forge
dependencies:
  # Python version  
  - python=3.11.14

  # Core scientific computing 
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.17.0

  # Machine learning 
  - scikit-learn=1.8.0

  # Statistics
  - statsmodels=0.14.6

  # Network Analysis
  - networkx=3.1

  # Chemistry & Bioinformatics
  - rdkit=2025.09.5
  - biopython=1.86

  # Visualization
  - matplotlib=3.8.0
  - seaborn=0.12.2

  # Jupyter Ecosystem
  - notebook=7.5.3
  - jupyterlab=4.5.3
  - ipywidgets=8.1.8
  - jupyter=1.1.1
  - ipykernel=7.1.0

  # Data Import/Export
  - openpyxl=3.1.5

  # Utilities
  - requests=2.32.5
  - pyyaml=6.0.3

  # Pip packages
  - pip=26.0
  - pip:
      - gensim==4.4.0
      - node2vec==0.5.0
